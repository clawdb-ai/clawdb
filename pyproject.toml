[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawdb"
version = "0.1.0"
description = "Async memory backend for OpenClaw integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "numpy>=2.0.0",
  "scipy>=1.13.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.27.0",
  "pyzmq>=26.0.0",
  "typing-extensions>=4.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
